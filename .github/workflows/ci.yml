name: Validate and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  powershell-validate:
    name: PowerShell validation
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Windows PowerShell 5.1 -------------------------------------------
      # This is the production runtime: Brave-Free-Origin.bat launches
      # powershell.exe, not pwsh. Anything that only works under PowerShell 7
      # is broken for every user, so 5.1 is validated first and in full.
      - name: Parse application scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          $files = @(Get-Item 'Brave-Free-Origin.ps1') + @(Get-ChildItem 'src', 'tweaks' -Recurse -File -Include '*.ps1', '*.psd1')
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { "$($file.FullName):"; $errors | Format-List *; $failed = $true }
          }
          if ($failed) { exit 1 }
          "Windows PowerShell $($PSVersionTable.PSVersion) parse OK ($($files.Count) files)"

      # The window is loose XAML parsed at startup, so a typo in a template
      # would only surface when someone launches the app. Parse it exactly the
      # way src\ui\Window.ps1 does: Theme.xaml merged in through a file URI.
      - name: Load window XAML (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Add-Type -AssemblyName PresentationFramework, PresentationCore, WindowsBase
          $xamlDir = (Resolve-Path 'src\ui\xaml').Path
          $text = [System.IO.File]::ReadAllText((Join-Path $xamlDir 'Window.xaml'))
          $text = $text.Replace('__THEME_URI__', ([Uri](Join-Path $xamlDir 'Theme.xaml')).AbsoluteUri)
          $window = [System.Windows.Markup.XamlReader]::Parse($text)
          if (-not $window.FindName('NavList')) { throw 'Window.xaml parsed, but NavList is missing.' }
          'Window XAML OK'

      - name: Parse tooling scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in (Get-ChildItem 'tools' -Filter '*.ps1' -File)) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List *; $failed = $true }
          }
          if ($failed) { exit 1 }
          'Tooling parse OK'

      # Invoked exactly the way the docs tell a maintainer to invoke it: no
      # arguments. $PSScriptRoot is empty while param() defaults are evaluated
      # under 5.1, so a tool that only works with explicit paths would pass a
      # pwsh-only CI and fail on a real machine.
      - name: Validate locales (Windows PowerShell 5.1, no arguments)
        shell: powershell
        run: |
          .\tools\Test-Locales.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Loads tweaks\ through the app's own loader and checks every cross
      # reference: strings, preset contents, hosts ids, duplicate policies.
      - name: Validate tweak data (Windows PowerShell 5.1, no arguments)
        shell: powershell
        run: |
          .\tools\Test-Tweaks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check generated en-US.json (Windows PowerShell 5.1, no arguments)
        shell: powershell
        run: |
          .\tools\Export-EnglishLocale.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $diff = git diff --name-only -- 'locales/en-US.json'
          if ($diff) {
            git --no-pager diff -- 'locales/en-US.json'
            throw 'locales/en-US.json is out of date. Run tools\Export-EnglishLocale.ps1 and commit the result.'
          }
          'en-US.json is current under Windows PowerShell 5.1'

      # --- PowerShell 7 -----------------------------------------------------
      # Not the shipping runtime, but a cheap second opinion: it catches
      # constructs that changed meaning between hosts, and the exporter's
      # output must be byte-identical under both (hence the ordinal key sort).
      - name: Parse application scripts (PowerShell 7)
        shell: pwsh
        run: |
          $failed = $false
          $files = @(Get-Item 'Brave-Free-Origin.ps1') + @(Get-ChildItem 'src', 'tweaks' -Recurse -File -Include '*.ps1', '*.psd1')
          foreach ($file in $files) {
            $errors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { "$($file.FullName):"; $errors | Format-List *; $failed = $true }
          }
          if ($failed) { exit 1 }
          "PowerShell $($PSVersionTable.PSVersion) parse OK ($($files.Count) files)"

      - name: Validate locales (PowerShell 7)
        shell: pwsh
        run: |
          ./tools/Test-Locales.ps1 -MinCoverage 50
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate tweak data (PowerShell 7)
        shell: pwsh
        run: |
          ./tools/Test-Tweaks.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check generated en-US.json is host-independent (PowerShell 7)
        shell: pwsh
        run: |
          ./tools/Export-EnglishLocale.ps1
          $diff = git diff --name-only -- 'locales/en-US.json'
          if ($diff) {
            git --no-pager diff -- 'locales/en-US.json'
            throw 'tools/Export-EnglishLocale.ps1 produced different output under PowerShell 7 than under Windows PowerShell 5.1. The generator must be deterministic across hosts.'
          }
          'en-US.json is identical under PowerShell 7'

      # The same rules the VS Code PowerShell extension shows as warnings,
      # configured by PSScriptAnalyzerSettings.psd1. Any finding fails the build,
      # so warnings cannot pile up again.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          }
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($findings.Count -gt 0) {
            $findings | Format-Table RuleName, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 220
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }
          'PSScriptAnalyzer: no findings'

      # --- Encoding and packaging guards ------------------------------------
      # Windows PowerShell 5.1 decodes a BOM-less .ps1 with the system ANSI
      # code page. Any non-ASCII byte in the app would mojibake on machines
      # whose code page differs from the author's, so translated text must
      # live in locales\*.json and every script, data or XAML file must stay
      # pure ASCII (XAML writes icon glyphs as &#xE713; references).
      - name: Enforce ASCII-only application files
        shell: pwsh
        run: |
          $files = @(Get-Item 'Brave-Free-Origin.ps1') + @(Get-ChildItem 'src', 'tweaks' -Recurse -File -Include '*.ps1', '*.psd1', '*.xaml' -ErrorAction SilentlyContinue)
          foreach ($file in $files) {
            $name = Resolve-Path -Relative $file.FullName
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$name has a UTF-8 BOM. It must be saved without one."
            }
            $bad = @()
            $line = 1
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 0x0A) { $line++ }
              elseif ($bytes[$i] -gt 127) { $bad += $line }
            }
            if ($bad.Count -gt 0) {
              throw "Non-ASCII bytes in $name at line(s): $(($bad | Select-Object -Unique -First 10) -join ', '). Put translated text in locales\*.json instead."
            }
          }
          "ASCII check OK ($($files.Count) files)"

      # Locale files are the one place UTF-8 is expected. A BOM or a UTF-16
      # file would be silently mis-decoded by the runtime loader.
      - name: Enforce UTF-8 without BOM on locale files
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem 'locales' -Filter '*.json' -File)) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$($file.Name) has a UTF-8 BOM. Save it without one."
            }
            if ($bytes.Length -ge 2 -and (($bytes[0] -eq 0xFF -and $bytes[1] -eq 0xFE) -or ($bytes[0] -eq 0xFE -and $bytes[1] -eq 0xFF))) {
              throw "$($file.Name) looks like UTF-16. Locale files must be UTF-8."
            }
            $strict = New-Object System.Text.UTF8Encoding($false, $true)
            try { [void]$strict.GetString($bytes) }
            catch { throw "$($file.Name) is not valid UTF-8." }
          }
          'Locale encoding OK'

      - name: Check launcher target
        shell: pwsh
        run: |
          if (-not (Test-Path 'Brave-Free-Origin.bat')) { throw 'Launcher is missing.' }
          if (-not (Test-Path 'Brave-Free-Origin.ps1')) { throw 'PowerShell app is missing.' }
          if (-not (Test-Path 'src' -PathType Container)) { throw 'src folder is missing.' }
          if (-not (Test-Path 'tweaks' -PathType Container)) { throw 'tweaks folder is missing.' }
          $bat = Get-Content 'Brave-Free-Origin.bat' -Raw
          if ($bat -notmatch 'Brave-Free-Origin\.ps1') { throw 'Launcher does not reference Brave-Free-Origin.ps1.' }
          'Launcher check OK'

      # The portable zip is a build output, not a tracked source file. It is
      # produced here and uploaded as an artifact / attached to a release.
      # tools\ is maintainer-only and deliberately not shipped.
      - name: Build portable zip
        shell: pwsh
        run: |
          $out = 'Brave-Free-Origin.zip'
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path @(
            'Brave-Free-Origin.bat',
            'Brave-Free-Origin.ps1',
            'README.md',
            'README.zh-CN.md',
            'TRANSLATING.md',
            'LICENSE',
            'images',
            'locales',
            'src',
            'tweaks'
          ) -DestinationPath $out -Force
          Get-FileHash $out -Algorithm SHA256 | Format-List

      - name: Verify portable zip contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'Brave-Free-Origin.zip'))
          $names = $zip.Entries.FullName
          $zip.Dispose()
          $required = @(
            'Brave-Free-Origin.bat',
            'Brave-Free-Origin.ps1',
            'README.md',
            'README.zh-CN.md',
            'TRANSLATING.md',
            'LICENSE',
            'locales/en-US.json',
            'locales/zh-CN.json',
            'images/screenshot.png',
            'src/ui/xaml/Theme.xaml',
            'src/ui/xaml/Window.xaml'
          )
          # Every file the entry script dot-sources must ship, or the app cannot start.
          $main = Get-Content 'Brave-Free-Origin.ps1' -Raw
          $block = [regex]::Match($main, '(?s)\$script:SourceFiles = @\((.*?)\)').Groups[1].Value
          $loaded = @([regex]::Matches($block, "'([^']+)'") | ForEach-Object { 'src/' + ($_.Groups[1].Value -replace '\\', '/') })
          if ($loaded.Count -eq 0) { throw 'Could not read the load list from Brave-Free-Origin.ps1.' }
          $required += $loaded
          # And every tweak data file the loader reads.
          $required += @(Get-ChildItem 'tweaks' -Recurse -File | ForEach-Object { (Resolve-Path -Relative $_.FullName) -replace '^\.[\\/]', '' -replace '\\', '/' })
          foreach ($needed in $required) {
            if ($names -notcontains $needed -and $names -notcontains ($needed -replace '/', '\')) {
              throw "$needed is missing from the portable zip."
            }
          }
          # tools\ is for maintainers; shipping it would imply it is supported.
          foreach ($name in $names) {
            if ($name -match '^tools[\\/]') { throw "tools\ must not be shipped in the portable zip ($name)." }
          }
          "Portable zip contents OK ($($names.Count) entries)"

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: Brave-Free-Origin
          path: Brave-Free-Origin.zip
